<!DOCTYPE html>
<html>
<head>
  <title>Conoce tus derechos y deberes</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #ffe6f0; /* mismo fondo rosado */
      color: #4a2c2c;
      margin: 0;
      padding: 0;
    }
    section {
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      border: 2px solid #d63384;
      border-radius: 10px;
      width: 80%;
    }
    h2 {
      color: #d63384;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    ul li {
      margin: 10px 0;
    }
    ul li a {
      text-decoration: none;
      color: #d63384;
      font-weight: bold;
    }
    .imagenes {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .imagenes img {
      width: 300px;
      border: 2px solid #d63384;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <section>
    <h2>Conoce tus derechos y deberes</h2>
    <ul>
      <li><a href="derechos/Estatuto_Organico_UAGRM.pdf">Estatuto Orgánico UAGRM</a></li>
    </ul>

    <!-- Bloque de imágenes -->
    <div class="imagenes">
      <img src="img/derechos y deberes.jpeg" alt="Imagen Derechos 1">
      <img src="img/Reglamento.jpeg" alt="Imagen Derechos 2">
    </div>
  </section>
</body>
</html>
